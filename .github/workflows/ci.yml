name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  python-tests:
    name: Python tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run test suite
        # Deselect known pre-existing flakes so the compat matrix is green; all
        # are still run by the self-hosted deploy.yml `test` job (the deploy
        # gate), so coverage isn't lost:
        #  - the help test asserts `ohmo evals run --help` lists `--executor`, but
        #    an earlier test leaks a narrow Rich console width that collapses the
        #    help in the full-suite run (passes in isolation);
        #  - two async tests raise "Event loop is closed" during teardown ONLY on
        #    Python 3.10 (pass on 3.11+/3.12 deploy) — a pytest-asyncio 3.10 flake.
        # Drop these once the width leak / 3.10 teardown are fixed.
        run: >-
          uv run pytest -q
          --deselect "tests/test_ohmo/test_cli.py::test_ohmo_evals_run_command_help_lists_supported_executor_and_runner_ids"
          --deselect "tests/test_tools/test_task_tools.py::test_send_message_swarm_path_uses_subprocess_backend"
          --deselect "tests/test_evals/test_live_read.py::test_live_read_bash_tool_timeout_kills_process"

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check src tests scripts

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/terminal/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
