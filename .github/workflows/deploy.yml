name: Deploy (self-hosted)

# Self-hosted runner on the ohmo agent host (93.77.160.211, ~/ci).
#   push/PR -> deploy : tests (the live-web `eval` suite is excluded)
#   push    -> deploy : redeploy the gateway (auto, after a green test job)
#
# Deploy = reinstall the pipx package from the pushed `deploy` HEAD, wait for the
# gateway to be idle (so a restart doesn't drop an in-flight user turn), then
# restart the user-systemd unit. See adrs/ci-cd.md and ci/wait_for_idle.sh.
# (The upstream ci.yml still runs the GitHub-hosted matrix on main / PRs.)

on:
  push:
    branches: [deploy]
  pull_request:
    branches: [deploy]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Same-repo push/PR only — a fork PR must never reach the self-hosted
    # runner (host holds the private agents-playgroud checkout + live
    # gateway). Forks still get the GitHub-hosted matrix in ci.yml.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Set up user session (systemd --user / D-Bus)
        # The bash/task tools sandbox subprocesses with `systemd-run --user
        # --scope`; from the system-service runner that needs the user manager's
        # bus, else every such test fails "Failed to connect to bus".
        run: |
          uid="$(id -u)"
          echo "XDG_RUNTIME_DIR=/run/user/${uid}" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/${uid}/bus" >> "$GITHUB_ENV"

      - name: Create venv + install (dev extras)
        run: |
          python3 -m venv .ci-venv
          . .ci-venv/bin/activate
          python -m pip install -q --upgrade pip
          python -m pip install -q -e '.[dev]'

      - name: Tests (excluding the live-web eval suite)
        # The deselected test asserts `ohmo evals run --help` lists `--executor`;
        # it passes in isolation but is order-dependent in the full suite (an
        # earlier test leaks a narrow Rich console width, collapsing the help).
        # Pre-existing flake, unrelated to deploy — drop the deselect once fixed.
        run: |
          . .ci-venv/bin/activate
          python -m pytest -m "not eval" --ignore=tests/eval -o addopts="" -q \
            --deselect "tests/test_ohmo/test_cli.py::test_ohmo_evals_run_command_help_lists_supported_executor_and_runner_ids"

      - name: Inner-loop eval gate (offline; ohmo golden bundle)
        # Before shipping a new agent, replay the frozen ohmo inner-loop bundle
        # with THIS build and require it to still pass. The bundle is private
        # (real session slices) so it lives in the private agents-playgroud repo,
        # already checked out on this host; extract it read-only via git archive.
        # The bundle's evals/spec.json pins the whole run as the `inner` preset
        # (offline cache-replay + mock skill + pinned prompt/history + gate
        # thresholds), so this is a one-liner and can't drift from the recording.
        # `--gate` sets the exit code from the preset's thresholds (not per-case
        # failures). Offline: no model API / no ~/.ohmo. See that repo's
        # evals/README.md and adrs/ohmo-eval-goldens-flywheel.md.
        run: |
          . .ci-venv/bin/activate
          BUNDLE="$HOME/agents-playgroud"
          git -C "$BUNDLE" fetch origin -q
          WS="$(mktemp -d)"; mkdir -p "$WS/evals"
          git -C "$BUNDLE" archive origin/main evals | tar -x -C "$WS"
          ohmo evals run --workspace "$WS" --preset inner --gate \
            --output inner_eval_report.json --report-only

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/deploy'
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v4

      - name: Reinstall openharness-ai from deploy HEAD
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          pipx install --force "git+https://github.com/blackwithwhite666/OpenHarness@deploy"

      - name: Wait for the gateway to be idle
        run: bash ci/wait_for_idle.sh

      - name: Restart the gateway (user systemd)
        run: |
          uid="$(id -u)"
          export XDG_RUNTIME_DIR="/run/user/${uid}"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/${uid}/bus"
          systemctl --user restart ohmo-gateway.service
          sleep 3
          systemctl --user is-active ohmo-gateway.service
          journalctl --user -u ohmo-gateway.service -n 15 --no-pager
